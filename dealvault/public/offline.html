<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Valtwise</title>
    <style>
        :root {
            --dark: #18181b;
            --green: #22c55e;
            --gray-2: #e4e4e7;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            border: 1px solid var(--gray-2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            background: #fef3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            color: var(--dark);
            margin-bottom: 12px;
        }
        p {
            color: #71717a;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .retry-btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--green);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .retry-btn:hover {
            background: #16a34a;
        }
        .logo {
            margin-top: 32px;
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        .logo span {
            color: var(--green);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
        <div class="logo">valt<span>wise</span></div>
    </div>
</body>
</html>
